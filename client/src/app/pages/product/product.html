@if (product(); as currentProduct) {

  <section class="max-w-7xl mx-auto px-8 py-16">

    <div class="grid grid-cols-1 md:grid-cols-2 gap-12">

      
      <div class="bg-stone-100">

        <img
          [src]="currentProduct.image"
          [alt]="currentProduct.name"
          class="w-full h-137.5 object-cover"
        >

      </div>


      
      <div class="flex flex-col justify-center">

        
        <p class="text-sm text-gray-500 mb-2">
          {{ currentProduct.category }}
        </p>

        
        <h1 class="text-4xl font-semibold">
          {{ currentProduct.name }}
        </h1>

        
        <p class="text-2xl font-semibold mt-4">
          {{ currentProduct.price }} kr
        </p>

        
        <p class="text-gray-600 mt-6">
          {{ currentProduct.description }}
        </p>

        
        <button
          class="mt-8 bg-amber-950 text-white py-4 px-8 rounded-full cursor-pointer"
        >
          Lägg i kundvagn
        </button>

      </div>

    </div>

  </section>
  @if (relatedProducts().length > 0) {

  <section class="max-w-7xl mx-auto px-8 pb-16">

    <h2 class="text-2xl font-semibold mb-8">
      Liknande produkter
    </h2>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">

      <app-product-card
        *ngFor="let relatedProduct of relatedProducts()"
        [product]="relatedProduct">
      </app-product-card>

    </div>

  </section>

}

}
