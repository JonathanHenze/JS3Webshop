<app-hero
  [title]="hero.title"
  [text]="hero.text"
  [buttonText]="hero.buttonText">
</app-hero>

<section class="max-w-7xl mx-auto px-4 md:px-8 py-10">

  <div class="grid grid-cols-1 md:grid-cols-3 gap-5">

    <app-spot
      *ngFor="let spot of spots"
      [title]="spot.title"
      [image]="spot.image"
      [link]="spot.link">
    </app-spot>

  </div>

</section>


<section class="max-w-7xl mx-auto px-4 md:px-8 py-10 md:py-16">

  <div class="text-center mb-8">

    <h2 class="text-2xl md:text-3xl font-semibold">
      Våra produkter
    </h2>

    <p class="mt-2 text-gray-500">
      Upptäck våra senaste produkter
    </p>

  </div>

  <div class="flex flex-wrap justify-center gap-2 md:gap-4 mb-10">

    <button
      class="px-4 md:px-5 py-2 border rounded-full cursor-pointer"
      [class.bg-amber-950]="selectedCategory === 'Alla'"
      [class.text-white]="selectedCategory === 'Alla'"
      (click)="selectCategory('Alla')"
    >
      Alla
    </button>

    <button
      class="px-4 md:px-5 py-2 border rounded-full cursor-pointer"
      [class.bg-amber-950]="selectedCategory === 'T-shirts'"
      [class.text-white]="selectedCategory === 'T-shirts'"
      (click)="selectCategory('T-shirts')"
    >
      T-shirts
    </button>

    <button
      class="px-4 md:px-5 py-2 border rounded-full cursor-pointer"
      [class.bg-amber-950]="selectedCategory === 'Hoodies'"
      [class.text-white]="selectedCategory === 'Hoodies'"
      (click)="selectCategory('Hoodies')"
    >
      Hoodies
    </button>

    <button
      class="px-4 md:px-5 py-2 border rounded-full cursor-pointer"
      [class.bg-amber-950]="selectedCategory === 'Sweatshirt'"
      [class.text-white]="selectedCategory === 'Sweatshirt'"
      (click)="selectCategory('Sweatshirt')"
    >
      Sweatshirt
    </button>

    <button
      class="px-4 md:px-5 py-2 border rounded-full cursor-pointer"
      [class.bg-amber-950]="selectedCategory === 'Byxor'"
      [class.text-white]="selectedCategory === 'Byxor'"
      (click)="selectCategory('Byxor')"
    >
      Byxor
    </button>

  </div>

  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5 md:gap-8">

    <app-product-card
      *ngFor="let product of filteredProducts"
      [product]="product">
    </app-product-card>

  </div>

</section>
