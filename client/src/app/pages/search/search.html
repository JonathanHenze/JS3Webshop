<section class="max-w-7xl mx-auto px-4 md:px-8 py-10 md:py-16">

  <h1 class="text-3xl font-semibold">
    Sökresultat för "{{ searchText }}"
  </h1>

  <p class="mt-2 text-gray-500">
    Hittade {{ products.length }} produkter
  </p>

  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5 md:gap-8 mt-10">

    <app-product-card
      *ngFor="let product of products"
      [product]="product">
    </app-product-card>

  </div>

</section>
